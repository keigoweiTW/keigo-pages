<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Keigo 的靜態網頁收藏。">
<title>Keigo's Pages</title>
<script>(function(){try{var k='keigo-pages-theme',s=localStorage.getItem(k);
var t=(s==='dark'||s==='light')?s:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}

:root{
  --maxw:860px;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:18px;
  --bar-h:58px;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0f14;
  --surface:#171c26;
  --surface-2:#1b2130;
  --text:#e8ebf0;
  --text-dim:#a3acbd;
  --text-faint:#7c8698;
  --accent:#e63946;
  --accent-soft:rgba(230,57,70,.14);
  --gold:#f4a261;
  --gold-soft:rgba(244,162,97,.13);
  --line:rgba(255,255,255,.09);
  --line-strong:rgba(255,255,255,.16);
  --bar-bg:rgba(13,15,20,.82);
  --shadow:0 18px 40px -24px rgba(0,0,0,.9);
  --glow:radial-gradient(680px 320px at 18% -8%,rgba(230,57,70,.20),transparent 70%),radial-gradient(560px 300px at 88% 4%,rgba(244,162,97,.13),transparent 72%);
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f7f6f2;
  --surface:#ffffff;
  --surface-2:#fbfaf6;
  --text:#1e232a;
  --text-dim:#535c68;
  --text-faint:#79828f;
  --accent:#b3202c;
  --accent-soft:rgba(179,32,44,.08);
  --gold:#b8611b;
  --gold-soft:rgba(184,97,27,.10);
  --line:rgba(30,35,42,.11);
  --line-strong:rgba(30,35,42,.2);
  --bar-bg:rgba(247,246,242,.88);
  --shadow:0 16px 34px -26px rgba(30,35,42,.5);
  --glow:radial-gradient(680px 320px at 18% -8%,rgba(179,32,44,.10),transparent 70%),radial-gradient(560px 300px at 88% 4%,rgba(184,97,27,.08),transparent 72%);
}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:17px;
  line-height:1.8;
  letter-spacing:.012em;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
  overflow-wrap:break-word;
  display:flex;flex-direction:column;
  transition:background-color .35s ease,color .35s ease;
}

/* ----------------------------------------------------------------- top bar */
.topbar{
  position:sticky;top:0;z-index:50;
  background:var(--bar-bg);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line);
}
.topbar__inner{
  max-width:var(--maxw);margin:0 auto;height:var(--bar-h);
  padding:0 20px;
  display:flex;align-items:center;gap:12px;
}
.brand{
  display:inline-flex;align-items:center;gap:10px;
  min-width:0;flex:1 1 auto;
  color:var(--text);text-decoration:none;
  font-size:15px;font-weight:700;letter-spacing:.02em;
}
.brand__mark{
  width:24px;height:24px;flex:0 0 auto;border-radius:8px;
  background:linear-gradient(140deg,var(--accent),var(--gold));
  box-shadow:0 4px 12px -4px rgba(230,57,70,.7);
  position:relative;
}
.brand__mark::after{
  content:"";position:absolute;inset:6.5px 5.5px;
  border:1.5px solid rgba(255,255,255,.92);border-left:0;border-radius:0 4px 4px 0;
}
.brand__text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ------------------------------------------------------------------- toggle */
.toggle{
  flex:0 0 auto;
  display:inline-flex;align-items:center;gap:7px;
  height:36px;padding:0 13px;
  border:1px solid var(--line-strong);border-radius:999px;
  background:var(--surface);color:var(--text-dim);
  font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.02em;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background-color .25s,border-color .25s,color .25s,transform .12s;
}
.toggle:hover{border-color:var(--accent);color:var(--text)}
.toggle:active{transform:scale(.97)}
.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle__ico{font-size:14px;line-height:1}
html[data-theme="dark"] .toggle__ico--sun{display:none}
html[data-theme="light"] .toggle__ico--moon{display:none}
html[data-theme="dark"] .toggle__lbl--dark{display:none}
html[data-theme="light"] .toggle__lbl--light{display:none}

/* --------------------------------------------------------------------- main */
main{
  flex:1 0 auto;
  width:100%;max-width:var(--maxw);margin:0 auto;
  padding:44px 20px 72px;
}
.hero{position:relative;margin-bottom:34px}
.hero::before{
  content:"";position:absolute;inset:-100px -40vw 0;
  background:var(--glow);pointer-events:none;z-index:-1;
}
.hero__kicker{
  display:inline-block;margin:0 0 14px;
  padding:5px 12px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);
  font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
}
.hero h1{
  margin:0 0 12px;
  font-size:clamp(30px,6vw,42px);
  line-height:1.28;letter-spacing:-.01em;font-weight:800;
}
.hero h1 em{
  font-style:normal;
  background:linear-gradient(100deg,var(--accent),var(--gold));
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:var(--accent);
}
.hero p{
  margin:0;max-width:34em;
  color:var(--text-dim);font-size:16px;line-height:1.85;
}

/* -------------------------------------------------------------------- cards */
.section__label{
  display:flex;align-items:center;gap:12px;
  margin:0 0 16px;color:var(--text-faint);
  font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
}
.section__label::after{
  content:"";flex:1 1 auto;height:1px;background:var(--line);
}
.grid{display:grid;gap:16px}

.card{
  position:relative;display:block;
  padding:22px 22px 20px;
  background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);
  color:inherit;text-decoration:none;
  box-shadow:var(--shadow);
  overflow:hidden;
  transition:transform .2s ease,border-color .2s ease,background-color .2s ease;
}
.card::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--accent),var(--gold));
  opacity:.85;
}
.card:hover{transform:translateY(-3px);border-color:var(--line-strong)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card__top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card__tag{
  padding:3px 10px;border-radius:999px;
  background:var(--gold-soft);color:var(--gold);
  font-size:11.5px;font-weight:700;letter-spacing:.06em;
}
.card__date{color:var(--text-faint);font-size:12.5px;letter-spacing:.04em}
.card h2{
  margin:0 0 8px;
  font-size:19.5px;line-height:1.5;font-weight:700;letter-spacing:-.005em;
}
.card p{
  margin:0;color:var(--text-dim);font-size:15px;line-height:1.8;
}
.card__go{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:16px;
  color:var(--accent);font-size:14px;font-weight:700;
}
.card__go span{transition:transform .2s ease}
.card:hover .card__go span{transform:translateX(4px)}

/* --------------------------------------------------------------------- foot */
.foot{
  flex:0 0 auto;
  border-top:1px solid var(--line);
  padding:22px 20px 30px;
  text-align:center;
  color:var(--text-faint);
  font-size:12.5px;line-height:1.9;
}
.foot a{color:var(--text-dim);text-decoration:none;border-bottom:1px solid var(--line-strong)}
.foot a:hover{color:var(--accent);border-color:var(--accent)}
kbd{
  display:inline-block;padding:1px 6px;margin:0 1px;
  border:1px solid var(--line-strong);border-radius:5px;
  background:var(--surface-2);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
}

@media (max-width:520px){
  main{padding:34px 16px 56px}
  .card{padding:19px 18px 17px}
  .hero h1{font-size:28px}
  .toggle{padding:0 11px}
  .toggle__lbl{display:none}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

@media print{
  .topbar{position:static;background:none}
  .toggle{display:none}
  body{background:#fff;color:#111}
  .card{box-shadow:none;break-inside:avoid}
}
</style>
<noscript><style>.toggle{display:none}</style></noscript>
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="./">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__text">Keigo's Pages</span>
    </a>
    <button class="toggle" id="themeToggle" type="button" aria-pressed="true" aria-label="目前為深色模式，點擊切換為淺色模式" title="切換為淺色模式（T）">
      <span class="toggle__ico toggle__ico--sun" aria-hidden="true">☀️</span>
      <span class="toggle__ico toggle__ico--moon" aria-hidden="true">🌙</span>
      <span class="toggle__lbl toggle__lbl--light">淺色</span>
      <span class="toggle__lbl toggle__lbl--dark">深色</span>
    </button>
  </div>
</header>

<main>
  <section class="hero">
    <p class="hero__kicker">Static Pages</p>
    <h1>一些值得<em>慢慢看</em>的頁面</h1>
    <p>這裡收著我做好的單頁網頁，每一頁都是獨立、可離線閱讀的檔案。點進去看，或按 <kbd>T</kbd> 切換深淺色。</p>
  </section>

  <section aria-labelledby="pagesLabel">
    <h2 class="section__label" id="pagesLabel">收錄頁面</h2>
    <div class="grid">
      <a class="card" href="./doomsday/">
        <div class="card__top">
          <span class="card__tag">MARVEL</span>
          <span class="card__date">2026 · 11</span>
        </div>
        <h2>《復仇者聯盟：末日崛起》終極懶人包</h2>
        <p>進戲院前需要知道的所有鋪陳：七個階段、一條主線，從洛基打破時間牢籠到毀滅博士登場，文長慎入，建議配著茶慢慢看。</p>
        <span class="card__go">開始閱讀 <span aria-hidden="true">→</span></span>
      </a>
    </div>
  </section>
</main>

<footer class="foot">
  <span>Keigo's Pages · 靜態網頁收藏</span><br>
  <span>按 <kbd>T</kbd> 切換深淺色 · 主題自動跟隨系統設定</span>
</footer>

<script>(function(){
  var root=document.documentElement,
      KEY='keigo-pages-theme',
      mq=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null,
      toggle=document.getElementById('themeToggle'),
      meta=document.querySelector('meta[name="theme-color"]');

  function themeColor(t){return t==='dark'?'#0d0f14':'#f7f6f2';}

  function paint(t){
    var dark=(t!=='light');
    root.setAttribute('data-theme',dark?'dark':'light');
    if(meta){meta.setAttribute('content',themeColor(dark?'dark':'light'));}
    if(toggle){
      toggle.setAttribute('aria-pressed',dark?'true':'false');
      toggle.setAttribute('aria-label',dark?'目前為深色模式，點擊切換為淺色模式':'目前為淺色模式，點擊切換為深色模式');
      toggle.setAttribute('title',dark?'切換為淺色模式（T）':'切換為深色模式（T）');
    }
  }

  function stored(){try{var s=localStorage.getItem(KEY);return (s==='dark'||s==='light')?s:null;}catch(e){return null;}}
  function system(){return (mq&&mq.matches===false)?'light':'dark';}

  paint(stored()||root.getAttribute('data-theme')||system());

  function flip(){
    var next=(root.getAttribute('data-theme')==='dark')?'light':'dark';
    paint(next);
    try{localStorage.setItem(KEY,next);}catch(e){}
  }
  if(toggle){toggle.addEventListener('click',flip);}

  document.addEventListener('keydown',function(e){
    if(e.metaKey||e.ctrlKey||e.altKey){return;}
    var tag=(e.target&&e.target.tagName)||'';
    if(tag==='INPUT'||tag==='TEXTAREA'||(e.target&&e.target.isContentEditable)){return;}
    if(e.key==='t'||e.key==='T'){flip();}
  });

  /* 沒有手動選過就跟著系統切換 */
  function follow(){
    if(!stored()){paint(system());}
  }
  if(mq){
    if(mq.addEventListener){mq.addEventListener('change',follow);}
    else if(mq.addListener){mq.addListener(follow);}
  }
})();</script>
</body>
</html>
